<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; media-src https:; frame-src https://www.youtube-nocookie.com https://embed.windy.com https://www.yr.no; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2a1408">
<title>Stanleyho Superbox 85</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/jukebox.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<svg width="0" height="0" aria-hidden="true" focusable="false" class="sprite">
  <defs>
    <symbol id="i-news" viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.1 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M3 3h7v3H6v4H3zM14 3h7v7h-3V6h-4zM3 14h3v4h4v3H3zM18 14h3v7h-7v-3h4z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M5 3h5v18H5zM14 3h5v18h-5z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/></symbol>
    <symbol id="i-mini" viewBox="0 0 24 24"><path d="M3 15h18v6H3zM7 3h10v8H7z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M4 7l3-3 5 5 5-5 3 3-5 5 5 5-3 3-5-5-5 5-3-3 5-5z"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 4v7h-7l2.7-2.7A5 5 0 0 0 7 12zM20 12a8 8 0 0 1-13.7 5.6L4 20v-7h7l-2.7 2.7A5 5 0 0 0 17 12z"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 4a1.6 1.6 0 1 0 0 3.2A1.6 1.6 0 0 0 8 7zm8 0a1.6 1.6 0 1 0 0 3.2A1.6 1.6 0 0 0 16 7zm-4 4.4a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2zM8 14a1.6 1.6 0 1 0 0 3.2A1.6 1.6 0 0 0 8 14zm8 0a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 3l10 9h-3v9h-5v-6h-4v6H5v-9H2z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M10 4L2 12l8 8v-5h10V9H10z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M2 5h8l2 3h10v11H2z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21C5 15.5 2 12.2 2 8.5 2 5.5 4.3 3.5 7 3.5c2 0 3.9 1.1 5 2.9 1.1-1.8 3-2.9 5-2.9 2.7 0 5 2 5 5 0 3.7-3 7-10 12.5z"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 1 1 9.9V14h-2v-2.1A5 5 0 0 1 12 2zm0 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM4 15h16v7H4z"/></symbol>
    <symbol id="i-cc" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3 5h18v14H3zm4 4a3 3 0 0 0 0 6h1.5v-1.8H7a1.2 1.2 0 0 1 0-2.4h1.5V9zm8 0a3 3 0 0 0 0 6h1.5v-1.8H15a1.2 1.2 0 0 1 0-2.4h1.5V9z"/></symbol>
    <symbol id="i-pow" viewBox="0 0 24 24"><path d="M11 2h2v10h-2zM6.3 5.3l1.4 1.4a7 7 0 1 0 8.6 0l1.4-1.4A9 9 0 1 1 6.3 5.3z"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 4l9 12H3z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 20L3 8h18z"/></symbol>
  </defs>
</svg>

<main id="app">
  <section id="cabinet" aria-label="Přehrávač">
    <header class="sign"><div class="bulbs" aria-hidden="true"></div><h1><span class="star" id="secret">★</span> Stanleyho Superbox 85 <span class="star">★</span></h1><div class="bulbs" aria-hidden="true"></div></header>
    <div id="screen-wrap">
      <div id="stage" aria-label="Obrazovka"><div id="idle" class="idle"><span>♪</span><p>Vyberte program a stiskněte Pustit</p></div></div>
      <div id="fs-bar" class="fs-bar">
        <button type="button" class="btn small" data-act="pause"><span class="lamp"></span><svg class="ico"><use href="#i-pause"/></svg><span class="lbl">Pauza</span></button>
        <button type="button" class="btn small" data-act="stop"><span class="lamp"></span><svg class="ico"><use href="#i-stop"/></svg><span class="lbl">Ukončit</span></button>
        <button type="button" class="btn small" data-act="full"><span class="lamp"></span><svg class="ico"><use href="#i-mini"/></svg><span class="lbl">Zmenšit</span></button>
        <button type="button" class="btn small" data-act="subs"><span class="lamp"></span><svg class="ico"><use href="#i-cc"/></svg><span class="lbl">Zapnout titulky</span></button>
        <button type="button" class="btn small" data-act="tune"><span class="lamp"></span><svg class="ico"><use href="#i-auto"/></svg><span class="lbl">Přeladit</span></button>
        <button type="button" class="btn small" data-act="channels"><span class="lamp"></span><svg class="ico"><use href="#i-folder"/></svg><span class="lbl">Seznam programů</span></button>
      </div>
    </div>
    <div id="infobar" class="infobar"><div id="status" class="status" role="status" aria-live="polite">Vítejte. Vyberte program.</div><div id="substatus" class="substatus"></div></div>
    <div id="m-flags" class="m-flags">
      <button type="button" class="flag" data-act="auto" data-flag="auto"></button>
      <button type="button" class="flag" data-act="subs" data-flag="subs"></button>
      <button type="button" class="flag" data-act="shuf" data-flag="shuf"></button>
    </div>
    <div id="m-panel" class="m-panel" aria-label="Hlavní ovládání">
      <div class="m-row">
        <button type="button" class="btn pwr" data-act="close"><span class="lamp"></span><svg class="ico"><use href="#i-pow"/></svg><span class="lbl">Vypnout</span></button>
        <button type="button" class="btn go" data-act="pp"><span class="lamp"></span><svg class="ico"><use href="#i-play"/></svg><span class="lbl">Pustit</span></button>
        <button type="button" class="btn grey" data-act="stop"><span class="lamp"></span><svg class="ico"><use href="#i-stop"/></svg><span class="lbl">Ukončit</span></button>
      </div>
    </div>
    <div id="m-browse" class="m-browse">
      <button type="button" class="btn" data-act="browse"><span class="lamp"></span><span class="lbl">Programy</span></button>
    </div>
    <div id="m-play" class="m-play">
      <div class="m-row">
        <button type="button" class="btn" data-act="full"><span class="lamp"></span><svg class="ico"><use href="#i-full"/></svg><span class="lbl">Celá obrazovka</span></button>
        <button type="button" class="btn" data-act="auto"><span class="lamp"></span><svg class="ico"><use href="#i-auto"/></svg><span class="lbl">Automat</span></button>
        <button type="button" class="btn" data-act="shuf"><span class="lamp"></span><svg class="ico"><use href="#i-dice"/></svg><span class="lbl">Náhodně</span></button>
      </div>
    </div>
    <div id="m-bottom" class="m-row m-bottom">
      <button type="button" class="btn" data-act="fav"><span class="lamp"></span><svg class="ico"><use href="#i-heart"/></svg><span class="lbl">Oblíbené</span></button>
      <button type="button" class="btn" data-act="news"><span class="lamp"></span><svg class="ico"><use href="#i-news"/></svg><span class="lbl">Nové</span></button>
      <button type="button" class="btn" data-act="offer"><span class="lamp"></span><svg class="ico"><use href="#i-gift"/></svg><span class="lbl">Nabídni mi</span></button>
      <button type="button" class="btn" data-act="subs"><span class="lamp"></span><svg class="ico"><use href="#i-cc"/></svg><span class="lbl">Titulky</span></button>
    </div>
    <div id="m-land" class="m-land">
      <button type="button" class="btn pwr" data-act="close"><span class="lamp"></span><svg class="ico"><use href="#i-pow"/></svg><span class="lbl">Vypnout</span></button>
      <button type="button" class="btn go" data-act="pp"><span class="lamp"></span><svg class="ico"><use href="#i-play"/></svg><span class="lbl">Pustit</span></button>
      <button type="button" class="btn" data-act="full"><span class="lamp"></span><svg class="ico"><use href="#i-full"/></svg><span class="lbl">Celá obrazovka</span></button>
      <button type="button" class="btn" data-act="homeplay"><span class="lamp"></span><svg class="ico"><use href="#i-home"/></svg><span class="lbl">Domů</span></button>
      <button type="button" class="btn wide" data-act="browse"><span class="lamp"></span><span class="lbl">Programy</span></button>
    </div>
    <div id="d-row" class="d-row" aria-label="Další ovládání">
      <button type="button" class="btn" data-act="full"><span class="lamp"></span><svg class="ico"><use href="#i-full"/></svg><span class="lbl">Celá obrazovka</span></button>
      <button type="button" class="btn" data-act="auto"><span class="lamp"></span><svg class="ico"><use href="#i-auto"/></svg><span class="lbl">Automat</span></button>
      <button type="button" class="btn" data-act="shuf"><span class="lamp"></span><svg class="ico"><use href="#i-dice"/></svg><span class="lbl">Náhodně</span></button>
      <button type="button" class="btn" data-act="subs"><span class="lamp"></span><svg class="ico"><use href="#i-cc"/></svg><span class="lbl">Titulky</span></button>
      <button type="button" class="btn" data-act="news"><span class="lamp"></span><svg class="ico"><use href="#i-news"/></svg><span class="lbl">Novinky</span></button>
    </div>
    <div id="controls" class="controls">
      <button type="button" class="btn" data-act="news"><span class="lamp"></span><svg class="ico"><use href="#i-news"/></svg><span class="lbl">Novinky</span></button>
      <button type="button" class="btn" data-act="play"><span class="lamp"></span><svg class="ico"><use href="#i-play"/></svg><span class="lbl">Pustit</span></button>
      <button type="button" class="btn" data-act="pause"><span class="lamp"></span><svg class="ico"><use href="#i-pause"/></svg><span class="lbl">Pauza</span></button>
      <button type="button" class="btn" data-act="stop"><span class="lamp"></span><svg class="ico"><use href="#i-stop"/></svg><span class="lbl">Ukončit</span></button>
      <button type="button" class="btn" data-act="full"><span class="lamp"></span><svg class="ico"><use href="#i-full"/></svg><span class="lbl">Celá obrazovka</span></button>
      <button type="button" class="btn" data-act="mini"><span class="lamp"></span><svg class="ico"><use href="#i-mini"/></svg><span class="lbl">Zmenšit</span></button>
      <button type="button" class="btn" data-act="auto"><span class="lamp"></span><svg class="ico"><use href="#i-auto"/></svg><span class="lbl">Automat</span></button>
      <button type="button" class="btn red" data-act="close"><span class="lamp"></span><svg class="ico"><use href="#i-close"/></svg><span class="lbl">Zavřít</span></button>
    </div>
    <div id="extras" class="extras">
      <button type="button" class="btn small" data-act="rand-here"><span class="lamp"></span><svg class="ico"><use href="#i-dice"/></svg><span class="lbl">Náhodně ve složce</span></button>
      <button type="button" class="btn small" data-act="rand-all"><span class="lamp"></span><svg class="ico"><use href="#i-dice"/></svg><span class="lbl">Náhodně ze všeho</span></button>
    </div>
  </section>

  <aside id="listbox" aria-label="Seznam programů">
    <h2 class="marquee" id="marquee">Programy</h2>
    <div class="navrow">
      <button type="button" class="btn nav" data-act="home"><span class="lamp"></span><svg class="ico"><use href="#i-home"/></svg><span class="lbl">Domů</span></button>
      <button type="button" class="btn nav" data-act="back"><span class="lamp"></span><svg class="ico"><use href="#i-back"/></svg><span class="lbl">Zpět</span></button>
      <button type="button" class="btn nav m-only" data-act="full"><span class="lamp"></span><svg class="ico"><use href="#i-full"/></svg><span class="lbl">Celá obrazovka</span></button>
    </div>
    <div id="crumbs" class="crumbs">Domů</div>
    <div class="listwrap">
    <div id="list" class="list" tabindex="0"></div>
    <div class="arrowrow">
      <button type="button" class="btn arrow" data-act="up" aria-label="Nahoru"><svg class="ico"><use href="#i-up"/></svg><span class="lbl">Nahoru</span></button>
      <button type="button" class="btn arrow" data-act="down" aria-label="Dolů"><svg class="ico"><use href="#i-down"/></svg><span class="lbl">Dolů</span></button>
    </div>
    </div>
  </aside>
</main>
<footer class="copy">© 2026 SRG68</footer>

<div id="pin" class="pinwrap" hidden role="dialog" aria-label="Zámek správce">
  <div class="pinbox"><div id="pin-dots" class="pin-dots" aria-live="polite"></div><div id="pin-msg" class="pin-msg"></div>
    <div class="pinpad" id="pinpad"></div></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
