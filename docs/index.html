<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; media-src https:; frame-src https://www.youtube-nocookie.com; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2a1408">
<title>Hrací skříň</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/jukebox.css">
</head>
<body>
<svg width="0" height="0" aria-hidden="true" focusable="false" class="sprite">
  <defs>
    <symbol id="i-news" viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.1 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M3 3h7v3H6v4H3zM14 3h7v7h-3V6h-4zM3 14h3v4h4v3H3zM18 14h3v7h-7v-3h4z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M5 3h5v18H5zM14 3h5v18h-5z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/></symbol>
    <symbol id="i-mini" viewBox="0 0 24 24"><path d="M3 15h18v6H3zM7 3h10v8H7z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M4 7l3-3 5 5 5-5 3 3-5 5 5 5-3 3-5-5-5 5-3-3 5-5z"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 4l9 12H3z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 20L3 8h18z"/></symbol>
  </defs>
</svg>

<main id="app">
  <section id="cabinet" aria-label="Přehrávač">
    <h1 class="marquee">Hrací skříň</h1>
    <div id="status" class="status" role="status" aria-live="polite">Vítejte. Vyberte pořad vpravo.</div>
    <div id="screen-wrap">
      <div id="stage" aria-label="Obrazovka"><div id="idle" class="idle"><span>♪</span><p>Vyberte pořad a stiskněte Pustit</p></div></div>
      <div id="fs-bar" class="fs-bar">
        <button type="button" class="btn small" data-act="pause"><span class="lamp"></span><svg class="ico"><use href="#i-pause"/></svg><span class="lbl">Pauza</span></button>
        <button type="button" class="btn small" data-act="stop"><span class="lamp"></span><svg class="ico"><use href="#i-stop"/></svg><span class="lbl">Ukončit</span></button>
        <button type="button" class="btn small" data-act="full"><span class="lamp"></span><svg class="ico"><use href="#i-full"/></svg><span class="lbl">Zpět</span></button>
      </div>
    </div>
    <div id="controls" class="controls">
      <button type="button" class="btn" data-act="news"><span class="lamp"></span><svg class="ico"><use href="#i-news"/></svg><span class="lbl">Novinky</span></button>
      <button type="button" class="btn" data-act="play"><span class="lamp"></span><svg class="ico"><use href="#i-play"/></svg><span class="lbl">Pustit</span></button>
      <button type="button" class="btn" data-act="pause"><span class="lamp"></span><svg class="ico"><use href="#i-pause"/></svg><span class="lbl">Pauza</span></button>
      <button type="button" class="btn" data-act="stop"><span class="lamp"></span><svg class="ico"><use href="#i-stop"/></svg><span class="lbl">Ukončit</span></button>
      <button type="button" class="btn" data-act="full"><span class="lamp"></span><svg class="ico"><use href="#i-full"/></svg><span class="lbl">Celá obrazovka</span></button>
      <button type="button" class="btn" data-act="mini"><span class="lamp"></span><svg class="ico"><use href="#i-mini"/></svg><span class="lbl">Zmenšit</span></button>
      <button type="button" class="btn red" data-act="close"><span class="lamp"></span><svg class="ico"><use href="#i-close"/></svg><span class="lbl">Zavřít</span></button>
    </div>
  </section>

  <aside id="listbox" aria-label="Seznam pořadů">
    <h2 class="marquee">Pořady</h2>
    <button type="button" class="btn arrow" data-act="up"><svg class="ico"><use href="#i-up"/></svg><span class="lbl">Nahoru</span></button>
    <div id="list" class="list" tabindex="0"></div>
    <button type="button" class="btn arrow" data-act="down"><svg class="ico"><use href="#i-down"/></svg><span class="lbl">Dolů</span></button>
  </aside>
</main>

<div id="asleep" class="asleep" hidden>
  <h2>Hrací skříň odpočívá</h2>
  <button type="button" class="btn big" data-act="wake"><span class="lamp"></span><svg class="ico"><use href="#i-play"/></svg><span class="lbl">Zapnout</span></button>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
